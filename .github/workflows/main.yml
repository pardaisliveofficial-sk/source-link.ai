name: SourceLink Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Bun
      # ---------------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ---------------------------------------------------------
      # 4. Install dependencies
      # Uses existing bun.lock
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # ---------------------------------------------------------
      # 5. Build web application
      # ---------------------------------------------------------
      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: bun run build

      # ---------------------------------------------------------
      # 6. Java 17
      # ---------------------------------------------------------
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 7. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 8. Standalone Gradle
      #
      # IMPORTANT:
      # We intentionally do NOT use android/gradlew.
      # This avoids the corrupt gradle-wrapper.jar problem.
      # ---------------------------------------------------------
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # ---------------------------------------------------------
      # 9. Capacitor Android sync
      # ---------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ---------------------------------------------------------
      # 10. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      # ---------------------------------------------------------
      # 11. Upload Debug APK
      # ---------------------------------------------------------
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcelink-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ---------------------------------------------------------
      # 12. Build Release APK + AAB
      # ---------------------------------------------------------
      - name: Build Release APK & AAB
        run: |
          cd android
          gradle assembleRelease bundleRelease --stacktrace

      # ---------------------------------------------------------
      # 13. Prepare signing keystore
      # ---------------------------------------------------------
      - name: Prepare Android Signing Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      # ---------------------------------------------------------
      # 14. Sign Release APK
      # ---------------------------------------------------------
      - name: Sign Release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" sign \
            --ks android/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

          mv \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------
      # 15. Sign Release AAB
      # ---------------------------------------------------------
      - name: Sign Release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore android/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      # ---------------------------------------------------------
      # 16. Upload Release APK + AAB
      # ---------------------------------------------------------
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sourcelink-app-release-builds
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # ---------------------------------------------------------
      # 17. Cleanup signing keystore
      # ---------------------------------------------------------
      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f android/release.keystore
