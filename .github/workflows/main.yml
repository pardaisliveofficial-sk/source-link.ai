name: SourceLink Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.sourcelinkai.soulverseapps.com' }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcelink-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Unsigned Release Bundle (AAB) & Release APK
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign Release APK & AAB (if secrets provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" android/app/build/outputs/apk/release/app-release-unsigned.apk "$KEY_ALIAS" || true
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS" || true

      - name: Upload Release Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: sourcelink-app-release-builds
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
